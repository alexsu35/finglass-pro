name: Build FinGlass Pro Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Capacitor Project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > package.json
          {
            "name": "finglass-pro",
            "version": "1.0.0",
            "description": "FinGlass Pro App",
            "private": true
          }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "FinGlass Pro" "com.finglass.pro" --web-dir www
          npx cap add android

      - name: Inject Permissions & Sync
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><application/g' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinGlass-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
