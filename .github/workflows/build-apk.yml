name: Build FinGlass Pro Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Inject JS Hook Inside Body
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat << 'EOF' > patch.js
          <script>
          (function() {
            window.triggerSystemFolderPicker = function() {
              try {
                if (window.AndroidFolderBridge && typeof window.AndroidFolderBridge.pickFolder === 'function') {
                  window.AndroidFolderBridge.pickFolder();
                  return;
                }
              } catch (e) {}
              // 100% железный резервный канал через системный перехватчик WebChromeClient
              prompt("FINGLASS_NATIVE_PICK_FOLDER", "");
            };

            window.openFolderPickerModal = window.triggerSystemFolderPicker;
            window.pickCustomDirectory = window.triggerSystemFolderPicker;

            document.addEventListener('click', function(e) {
              var el = e.target.closest('button, a, div[onclick]');
              if (!el) return;
              var txt = (el.innerText || el.textContent || '').toUpperCase();
              var onclickAttr = (el.getAttribute('onclick') || '');
              if (
                el.id === 'btn-pick-folder-settings' ||
                el.id === 'btn-pick-folder-receipt' ||
                txt.indexOf('ВЫБРАТЬ ПАПКУ') !== -1 ||
                txt.indexOf('ВЫБРАТЬ ИЛИ СОЗДАТЬ ПАПКУ') !== -1 ||
                onclickAttr.indexOf('triggerSystemFolderPicker') !== -1 ||
                onclickAttr.indexOf('openFolderPickerModal') !== -1 ||
                onclickAttr.indexOf('pickCustomDirectory') !== -1
              ) {
                e.preventDefault();
                e.stopPropagation();
                window.triggerSystemFolderPicker();
              }
            }, true);
          })();
          </script>
          </body>
          EOF

          # Вставляем скрипт строго ПЕРЕД закрывающим тегом </body>
          sed -i 's/<\/body>//g' www/index.html
          sed -i 's/<\/html>//g' www/index.html
          cat patch.js >> www/index.html
          echo "</html>" >> www/index.html

          npm init -y
          npm pkg set name="finglass-pro"
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "FinGlassPro" "com.finglass.pro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Locate Real MainActivity.java & Inject Native Folder Picker
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml

          # Находим реальный файл MainActivity.java, который создал Capacitor
          MAIN_ACT_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          echo "Found MainActivity at: $MAIN_ACT_FILE"
          PKG_LINE=$(grep "^package " "$MAIN_ACT_FILE" | head -n 1)
          echo "Detected package: $PKG_LINE"

          cat << EOF > "$MAIN_ACT_FILE"
          $PKG_LINE

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.DocumentsContract;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              private static final int REQUEST_CODE_OPEN_DIRECTORY = 9901;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  attachNativeHooks();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  attachNativeHooks();
              }

              private void attachNativeHooks() {
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          final WebView webView = this.bridge.getWebView();
                          webView.getSettings().setJavaScriptEnabled(true);
                          webView.getSettings().setDomStorageEnabled(true);
                          webView.addJavascriptInterface(new AndroidFolderBridge(this), "AndroidFolderBridge");

                          final WebChromeClient existingClient = webView.getWebChromeClient();
                          webView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, JsPromptResult result) {
                                  if ("FINGLASS_NATIVE_PICK_FOLDER".equals(message)) {
                                      result.confirm("OK");
                                      openSystemFolderPicker();
                                      return true;
                                  }
                                  if (existingClient != null) {
                                      return existingClient.onJsPrompt(view, url, message, defaultValue, result);
                                  }
                                  return super.onJsPrompt(view, url, message, defaultValue, result);
                              }
                          });
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public void openSystemFolderPicker() {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Toast.makeText(MainActivity.this, "Выберите папку для сохранения и подтвердите выбор внизу", Toast.LENGTH_LONG).show();
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION |
                                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                                              Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                              startActivityForResult(intent, REQUEST_CODE_OPEN_DIRECTORY);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Ошибка: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      }
                  });
              }

              public boolean writeToPickedFolder(String fileName, String content, String mimeType) {
                  try {
                      SharedPreferences prefs = getSharedPreferences("FinGlassPrefs", MODE_PRIVATE);
                      String uriStr = prefs.getString("tree_uri", null);

                      if (uriStr != null && !uriStr.isEmpty()) {
                          Uri treeUri = Uri.parse(uriStr);
                          String treeDocId = DocumentsContract.getTreeDocumentId(treeUri);
                          Uri parentDocUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, treeDocId);

                          Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, treeDocId);
                          Cursor c = null;
                          try {
                              c = getContentResolver().query(
                                  childrenUri,
                                  new String[]{DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME},
                                  null, null, null
                              );
                              if (c != null) {
                                  while (c.moveToNext()) {
                                      String docId = c.getString(0);
                                      String name = c.getString(1);
                                      if (fileName.equals(name)) {
                                          Uri existingUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, docId);
                                          DocumentsContract.deleteDocument(getContentResolver(), existingUri);
                                      }
                                  }
                              }
                          } catch (Exception ignored) {
                          } finally {
                              if (c != null) c.close();
                          }

                          String safeMime = (mimeType != null && !mimeType.isEmpty()) ? mimeType : "text/plain";
                          Uri newFileUri = DocumentsContract.createDocument(getContentResolver(), parentDocUri, safeMime, fileName);
                          if (newFileUri != null) {
                              OutputStream out = getContentResolver().openOutputStream(newFileUri, "wt");
                              if (out != null) {
                                  out.write(content.getBytes(StandardCharsets.UTF_8));
                                  out.flush();
                                  out.close();
                                  return true;
                              }
                          }
                      }

                      File dlDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "FinGlass_AutoSave");
                      if (!dlDir.exists()) dlDir.mkdirs();
                      File outFile = new File(dlDir, fileName);
                      FileOutputStream fos = new FileOutputStream(outFile, false);
                      fos.write(content.getBytes(StandardCharsets.UTF_8));
                      fos.flush();
                      fos.close();
                      return true;
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return false;
              }

              public class AndroidFolderBridge {
                  private MainActivity activity;
                  public AndroidFolderBridge(MainActivity activity) {
                      this.activity = activity;
                  }

                  @JavascriptInterface
                  public void pickFolder() {
                      activity.openSystemFolderPicker();
                  }

                  @JavascriptInterface
                  public boolean hasCustomFolder() {
                      SharedPreferences prefs = activity.getSharedPreferences("FinGlassPrefs", MODE_PRIVATE);
                      String uriStr = prefs.getString("tree_uri", null);
                      return uriStr != null && !uriStr.isEmpty();
                  }

                  @JavascriptInterface
                  public boolean saveFileToPickedFolder(String fileName, String content, String mimeType) {
                      return activity.writeToPickedFolder(fileName, content, mimeType);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQUEST_CODE_OPEN_DIRECTORY && resultCode == Activity.RESULT_OK && data != null) {
                      Uri treeUri = data.getData();
                      if (treeUri != null) {
                          final int takeFlags = (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                          try {
                              getContentResolver().takePersistableUriPermission(treeUri, takeFlags);
                          } catch (Exception ignored) {}

                          SharedPreferences prefs = getSharedPreferences("FinGlassPrefs", MODE_PRIVATE);
                          prefs.edit().putString("tree_uri", treeUri.toString()).apply();

                          String readablePath = treeUri.getLastPathSegment();
                          if (readablePath != null && readablePath.contains(":")) {
                              readablePath = "Внутренняя память / " + readablePath.substring(readablePath.indexOf(":") + 1);
                          } else if (readablePath == null) {
                              readablePath = treeUri.toString();
                          }

                          Toast.makeText(this, "Папка выбрана: " + readablePath, Toast.LENGTH_LONG).show();

                          final String safePath = readablePath.replace("'", "\\'");
                          final String safeUri = treeUri.toString().replace("'", "\\'");

                          if (this.bridge != null && this.bridge.getWebView() != null) {
                              this.bridge.getWebView().post(new Runnable() {
                                  @Override
                                  public void run() {
                                      MainActivity.this.bridge.getWebView().evaluateJavascript(
                                          "try { localStorage.setItem('finglass_picked_folder_v5', '" + safePath + "'); } catch(e){} " +
                                          "if(window.onAndroidFolderPicked){window.onAndroidFolderPicked('" + safePath + "', '" + safeUri + "');} " +
                                          "var el1=document.getElementById('settings-current-folder-path'); if(el1) el1.textContent='" + safePath + "'; " +
                                          "var el2=document.getElementById('receipt-target-folder-label'); if(el2) el2.textContent='" + safePath + "';",
                                          null
                                      );
                                  }
                              });
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinGlass-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
