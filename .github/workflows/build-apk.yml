name: Build FinGlass Pro Android APK

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build-apk:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Setup Java JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '21'

  - name: Prepare Capacitor Project
    run: |
      mkdir -p www
      cp index.html www/index.html
      npm init -y
      npm pkg set name="finglass-pro"
      npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
      npx cap init "FinGlass Pro" "com.finglass.pro" --web-dir www
      npx cap add android
      npx cap sync android

  - name: Inject Native Android System Folder Picker Bridge
    run: |
      cat << 'EOF' > android/app/src/main/java/com/finglass/pro/MainActivity.java
      package com.finglass.pro;

      import android.app.Activity;
      import android.content.Context;
      import android.content.Intent;
      import android.content.SharedPreferences;
      import android.net.Uri;
      import android.os.Bundle;
      import android.provider.DocumentsContract;
      import android.webkit.JavascriptInterface;
      import androidx.activity.result.ActivityResultLauncher;
      import androidx.activity.result.contract.ActivityResultContracts;
      import androidx.documentfile.provider.DocumentFile;
      import com.getcapacitor.BridgeActivity;
      import java.io.OutputStream;
      import java.nio.charset.StandardCharsets;

      public class MainActivity extends BridgeActivity {
          private ActivityResultLauncher<Intent> folderPickerLauncher;
          private static final String PREFS_NAME = "FinGlassNativePrefs";
          private static final String KEY_TREE_URI = "custom_tree_uri";
          private static final String KEY_DISPLAY_PATH = "custom_display_path";

          @Override
          public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              folderPickerLauncher = registerForActivityResult(
                  new ActivityResultContracts.StartActivityForResult(),
                  result -> {
                      if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                          Uri treeUri = result.getData().getData();
                          if (treeUri != null) {
                              final int takeFlags = Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION;
                              try {
                                  getContentResolver().takePersistableUriPermission(treeUri, takeFlags);
                              } catch (Exception ignored) {}

                              String readablePath = formatReadableTreeUri(treeUri);
                              SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                              prefs.edit()
                                  .putString(KEY_TREE_URI, treeUri.toString())
                                  .putString(KEY_DISPLAY_PATH, readablePath)
                                  .apply();

                              final String safeJsPath = readablePath.replace("'", "\\'");
                              final String safeJsUri = treeUri.toString().replace("'", "\\'");
                              if (getBridge() != null && getBridge().getWebView() != null) {
                                  getBridge().getWebView().post(() -> {
                                      getBridge().getWebView().evaluateJavascript(
                                          "if(window.onNativeFolderPicked){window.onNativeFolderPicked('" + safeJsPath + "','" + safeJsUri + "');}",
                                          null
                                      );
                                  });
                              }
                          }
                      }
                  }
              );

              if (getBridge() != null && getBridge().getWebView() != null) {
                  getBridge().getWebView().addJavascriptInterface(new NativeFolderBridge(), "FinGlassFolderPicker");
              }
          }

          private String formatReadableTreeUri(Uri treeUri) {
              try {
                  String docId = DocumentsContract.getTreeDocumentId(treeUri);
                  if (docId != null && docId.contains(":")) {
                      String[] parts = docId.split(":", 2);
                      String vol = "primary".equalsIgnoreCase(parts[0]) ? "Внутренняя память" : parts[0];
                      String rel = parts.length > 1 && !parts[1].isEmpty() ? parts[1] : "Корень";
                      return vol + " / " + rel.replace("/", " / ");
                  }
                  DocumentFile df = DocumentFile.fromTreeUri(this, treeUri);
                  if (df != null && df.getName() != null) {
                      return "Память телефона / " + df.getName();
                  }
              } catch (Exception ignored) {}
              return treeUri.getLastPathSegment() != null ? treeUri.getLastPathSegment() : "Выбранная папка";
          }

          public class NativeFolderBridge {
              @JavascriptInterface
              public void pickFolder() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION |
                      Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                      Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                  );
                  folderPickerLauncher.launch(intent);
              }

              @JavascriptInterface
              public boolean hasCustomFolder() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  String uriStr = prefs.getString(KEY_TREE_URI, "");
                  return uriStr != null && !uriStr.isEmpty();
              }

              @JavascriptInterface
              public String getSavedFolderDisplay() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return prefs.getString(KEY_DISPLAY_PATH, "");
              }

              @JavascriptInterface
              public void clearSavedFolder() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  prefs.edit().remove(KEY_TREE_URI).remove(KEY_DISPLAY_PATH).apply();
              }

              @JavascriptInterface
              public boolean saveFileToCustomFolder(String fileName, String content, String mimeType) {
                  try {
                      SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      String uriStr = prefs.getString(KEY_TREE_URI, "");
                      if (uriStr == null || uriStr.isEmpty()) return false;

                      Uri treeUri = Uri.parse(uriStr);
                      DocumentFile dir = DocumentFile.fromTreeUri(MainActivity.this, treeUri);
                      if (dir == null || !dir.canWrite()) return false;

                      DocumentFile existing = dir.findFile(fileName);
                      if (existing != null) {
                          existing.delete();
                      }

                      DocumentFile newFile = dir.createFile(mimeType != null ? mimeType : "text/plain", fileName);
                      if (newFile == null) return false;

                      try (OutputStream os = getContentResolver().openOutputStream(newFile.getUri(), "wt")) {
                          if (os == null) return false;
                          os.write(content.getBytes(StandardCharsets.UTF_8));
                          os.flush();
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
      }
      EOF

  - name: Build Debug APK
    working-directory: ./android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: FinGlass-Pro-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
